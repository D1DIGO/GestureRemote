# Label this automated check in the GitHub Actions interface.
name: Hardware-independent tests

# Validate pushed commits and proposed pull-request changes.
on: [push, pull_request]

# Define the jobs executed for each workflow run.
jobs:
  # Run the same test job across the supported CI combinations.
  test:
    # Expand this job into the operating-system and Python-version matrix.
    strategy:
      # Let other combinations finish even if one fails.
      fail-fast: false
      # List the independent environments to validate.
      matrix:
        # Check platform-independent behavior on Linux and Windows runners.
        os: [ubuntu-latest, windows-latest]
        # Check both ends of the project's stated Python version range.
        python: ['3.11', '3.14']
    # Allocate the operating system selected for this matrix entry.
    runs-on: ${{ matrix.os }}
    # Execute setup and validation in order within each runner.
    steps:
      # Download the repository contents into the runner workspace.
      - uses: actions/checkout@v4
      # Install the interpreter chosen by this matrix entry.
      - uses: actions/setup-python@v5
        # Supply interpreter and dependency-cache options to the setup action.
        with:
          # Use the exact major/minor version from the matrix.
          python-version: ${{ matrix.python }}
          # Reuse downloaded pip packages between compatible runs.
          cache: pip
          # Refresh the cache key when dependency declarations change.
          cache-dependency-path: requirements*.txt
      # Install both application packages and the test runner.
      - run: python -m pip install -r requirements-dev.txt
      # Detect incompatible or missing installed package dependencies.
      - run: python -m pip check
      # Fetch and verify the official model for the real CPU inference test.
      - run: python scripts/download_model.py
      # Validate the committed configuration without opening camera hardware.
      - run: python main.py --check-config
      # Run the complete suite with compact output.
      - run: python -m pytest -q
