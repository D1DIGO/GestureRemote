# Configure pytest for this repository.
[pytest]
# Discover tests in the project's testing package.
testpaths = testing
# Allow tests to import application modules from the repository root.
pythonpath = .
# Summarize skipped, failed, and other non-passing test outcomes.
addopts = -ra
# Register custom markers so pytest recognizes them without warnings.
markers =
    # Distinguish real-model inference from fully mocked unit tests.
    model: real CPU inference with the downloaded official model (no camera)
